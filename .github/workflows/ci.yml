name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render localized catalogue images
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-noto-core
          python -m pip install pymupdf==1.26.7
          python scripts/render_unseen_catalogue.py
      - run: npm run build
