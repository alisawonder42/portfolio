name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render localized catalogue images
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-noto-core
          python -m pip install pymupdf==1.26.7
          python scripts/render_unseen_catalogue.py
      - run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The config defines a preview environment, so wrangler refuses to
          # guess a target. An empty --env selects the top-level one.
          command: deploy --env=""
