<!doctype html>
<html lang="en">

  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <header class="chrome" data-chrome>
        <p class="eyebrow">Preview</p>
        <h1>The box</h1>
        <p class="lede">
          Drag to turn it. Hold, and it forgets that it is solid.
        </p>

        <span data-hint>Drag to turn · Hold to unmake</span>

        <button type="button" id="reset">Reset view</button>
        <p class="source" id="source">Looking for a scan…</p>
      </footer>
      <div class="drop" id="drop" hidden>
        <p>Drop a <code>.glb</code> or <code>.fbx</code> to replace the box</p>
      </div>
